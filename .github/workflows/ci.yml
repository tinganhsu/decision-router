name: ci

permissions:
  contents: read # the jobs only read the repo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm i -g --ignore-scripts @anthropic-ai/claude-code@2.1.325 # pinned; bump it together with the engine types the plugin is checked against
      # Both ran offline with an empty config dir locally (no login, no API key), so no auth is needed.
      - run: claude plugin validate .
      - run: claude plugin test .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts # dev tooling only; no install script has to run
      - run: npm run typecheck
      - run: npm run check:defaults
